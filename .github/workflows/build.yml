name: Build and package UUID_MORE plugin

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin.yml@v1
    with:
      plugin_name: uuid-more
      plugin_directory: uuid_more
      build_target: uuid_more
      plugin_library: uuid_more.so
      cmake_options: -DPLUGIN_DATE_EXTRA=DYNAMIC
      test_suite: uuid_more
      run_tests: ${{ startsWith(github.ref, 'refs/tags/v') }}
